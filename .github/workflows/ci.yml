name: OpenMind CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: ${{ github.workspace }}/backend
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      ENABLE_ML_STUBS: 'true'
      PRELOAD_EMBEDDING_MODEL: 'false'
      GEMINI_API_KEY: 'test-key'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run backend tests
        run: pytest tests -q

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build compose services
        run: docker compose build backend frontend
      - name: Smoke test compose stack
        run: |
          docker compose up -d backend frontend
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/v1/health >/dev/null && curl -fsS http://localhost:9002 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs --no-color backend frontend
          exit 1
